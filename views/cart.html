<!DOCTYPE html>
<html>
<head>
  <title>Your Cart - Bhuvi Boutique</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .cart-layout { display: grid; grid-template-columns: 1fr 380px; gap: 2rem; align-items: start; }
    @media (max-width: 900px) { .cart-layout { grid-template-columns: 1fr; } }
    .cart-item { background: #fff; border-radius: 8px; padding: 1.2rem; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; gap: 1rem; align-items: flex-start; }
    .cart-item img { width: 90px; height: 110px; object-fit: cover; border-radius: 6px; }
    .ci-info { flex: 1; }
    .ci-name { font-weight: 700; color: #2b2013; font-size: 1.05rem; margin-bottom: .2rem; }
    .ci-meta { color: #666; font-size: .85rem; margin-bottom: .2rem; }
    .ci-each { color: #999; font-size: .8rem; }
    .ci-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: .5rem; }
    .ci-line { font-weight: 700; color: #b8860b; font-size: 1.05rem; }
    .qty-box { display: inline-flex; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }
    .qty-box button { width: 34px; height: 34px; background: #faf8f5; border: none; font-size: 1rem; cursor: pointer; color: #2b2013; }
    .qty-box button:hover { background: #f0e9dd; }
    .qty-box input { width: 42px; text-align: center; border: none; font-size: .95rem; font-weight: 600; color: #2b2013; background: transparent; }
    .icon-btn { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: .35rem .7rem; cursor: pointer; font-size: .8rem; color: #555; }
    .icon-btn:hover { border-color: #b8860b; color: #b8860b; }
    .icon-btn.danger:hover { border-color: #c0392b; color: #c0392b; }
    .ci-instr { margin-top: .7rem; }
    .ci-instr label { display: block; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: #8a6d1f; margin-bottom: .3rem; }
    .ci-instr textarea { width: 100%; min-height: 56px; resize: vertical; padding: .55rem .7rem; border: 1px solid #e0d6c2; border-radius: 6px; font-family: inherit; font-size: .88rem; color: #2b2013; background: #fffdf8; }
    .ci-instr textarea:focus { outline: none; border-color: #b8860b; box-shadow: 0 0 0 3px rgba(184,134,11,.12); }
    .ci-instr .saved-note { font-size: .72rem; color: #27ae60; margin-top: .25rem; min-height: 1em; }
    .summary { background: #fff; border-radius: 8px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.05); position: sticky; top: 90px; }
    .summary h2 { font-family: Georgia, serif; letter-spacing: 2px; margin: 0 0 1rem; color: #2b2013; font-size: 1.2rem; }
    .sum-line { display: flex; justify-content: space-between; font-size: .92rem; color: #444; padding: .3rem 0; }
    .sum-total { display: flex; justify-content: space-between; font-weight: 800; font-size: 1.15rem; color: #2b2013; border-top: 1px solid #eee; margin-top: .6rem; padding-top: .8rem; }
    .summary .btn { width: 100%; margin-top: .6rem; }
    .btn-ghost { width: 100%; margin-top: .5rem; background: #fff; border: 1px solid #b8860b; color: #b8860b; padding: .7rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-ghost:hover { background: #fdf8ec; }
    .btn-clear { width: 100%; margin-top: .5rem; background: #fff; border: 1px solid #ddd; color: #888; padding: .6rem; border-radius: 6px; cursor: pointer; font-size: .85rem; }
    .btn-clear:hover { border-color: #c0392b; color: #c0392b; }
  </style>
</head>
<body>
  <div id="nav" class="nav"></div>

  <div class="container" style="padding: 2rem 1.5rem;">
    <h1 class="section-title">YOUR CART</h1>
    <div id="cartWrap"><p style="text-align:center;color:#666;padding:3rem;">Loading cart...</p></div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    requireAuth();
    let CART = [];

    async function loadCart() {
      try {
        CART = await api('/api/cart');
        render();
      } catch (e) {
        document.getElementById('cartWrap').innerHTML =
          `<div style="text-align:center;padding:2rem;color:#c0392b;"><p>${e.message}</p></div>`;
      }
    }

    function render() {
      const wrap = document.getElementById('cartWrap');
      if (!CART.length) {
        wrap.innerHTML =
          '<div style="text-align:center;padding:3rem;color:#666;">' +
          '<p style="font-size:1.2rem;margin-bottom:1rem;">🛒 Your cart is empty</p>' +
          '<a href="/shop" class="btn">Start Shopping</a></div>';
        return;
      }

      const itemsHtml = CART.map(it => {
        const p = it.Product || {};
        const img = (p.images && p.images[0]) || '';
        return `
          <div class="cart-item">
            ${img ? `<img src="${img}" alt="${p.name || ''}">` : ''}
            <div class="ci-info">
              <div class="ci-name">${p.name || 'Item'}</div>
              <div class="ci-meta">Size: ${it.size || 'Standard'} · Color: ${it.color || 'Standard'}</div>
              <div class="ci-each">${money(p.price)} each</div>
              <div class="ci-instr">
                <label>Special instructions</label>
                <textarea data-instr="${it.id}" placeholder="e.g., Pack as a gift, longer sleeves…">${(it.specialInstructions || '').replace(/</g, '&lt;')}</textarea>
                <div class="saved-note" id="note-${it.id}"></div>
              </div>
            </div>
            <div class="ci-right">
              <div class="qty-box">
                <button onclick="changeQty(${it.id}, -1)">−</button>
                <input value="${it.quantity}" readonly>
                <button onclick="changeQty(${it.id}, 1)">+</button>
              </div>
              <div class="ci-line">${money(p.price * it.quantity)}</div>
              <button class="icon-btn" onclick="saveForLater(${it.productId})">♡ Save</button>
              <button class="icon-btn danger" onclick="removeItem(${it.id})">✕</button>
            </div>
          </div>`;
      }).join('');

      const subtotal = CART.reduce((s, it) => s + (it.Product ? it.Product.price * it.quantity : 0), 0);

      wrap.innerHTML = `
        <div class="cart-layout">
          <div>${itemsHtml}</div>
          <div class="summary">
            <h2>ORDER SUMMARY</h2>
            <div class="sum-line"><span>Subtotal</span><span>${money(subtotal)}</span></div>
            <div class="sum-line"><span>Items</span><span>${CART.length} item${CART.length === 1 ? '' : 's'}</span></div>
            <div class="sum-total"><span>Total</span><span>${money(subtotal)}</span></div>
            <button class="btn" onclick="location.href='/checkout'">Proceed to Checkout →</button>
            <button class="btn-ghost" onclick="location.href='/shop'">Continue Shopping</button>
            <button class="btn-clear" onclick="clearCart()">🗑 Clear Cart</button>
          </div>
        </div>`;

      wrap.querySelectorAll('textarea[data-instr]').forEach(ta => {
        ta.addEventListener('change', async () => {
          const id = ta.dataset.instr;
          try {
            await api('/api/cart/' + id, {
              method: 'PUT',
              body: JSON.stringify({ specialInstructions: ta.value.trim() })
            });
            const note = document.getElementById('note-' + id);
            if (note) { note.textContent = '✓ Saved with this item'; setTimeout(() => note.textContent = '', 2500); }
          } catch (e) { toast('❌ ' + e.message); }
        });
      });
    }

    async function changeQty(id, d) {
      const it = CART.find(x => x.id === id);
      if (!it) return;
      const q = it.quantity + d;
      try {
        const r = await api('/api/cart/' + id, { method: 'PUT', body: JSON.stringify({ quantity: q }) });
        if (r && r.removed) CART = CART.filter(x => x.id !== id);
        else it.quantity = q;
        render();
      } catch (e) { toast('❌ ' + e.message); }
    }

    async function removeItem(id) {
      try { await api('/api/cart/' + id, { method: 'DELETE' }); CART = CART.filter(x => x.id !== id); render(); }
      catch (e) { toast('❌ ' + e.message); }
    }

    async function saveForLater(productId) {
      try { await api('/api/wishlist/toggle', { method: 'POST', body: JSON.stringify({ productId }) }); toast('♥ Saved to wishlist'); }
      catch (e) { toast('❌ ' + e.message); }
    }

    async function clearCart() {
      if (!confirm('Remove all items from your cart?')) return;
      try { await api('/api/cart', { method: 'DELETE' }); CART = []; render(); }
      catch (e) { toast('❌ ' + e.message); }
    }

    loadCart();
  </script>
</body>
</html>
