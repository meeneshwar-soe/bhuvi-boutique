<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="nav" class="nav"></div>
  <div class="form-box">
    <h2>Set New Password</h2>
    <!-- This message box will tell us exactly what is failing -->
    <div id="message" style="text-align:center; margin-bottom:1rem; font-weight:bold; color: blue;"></div>
    <form id="resetForm">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" name="password" minlength="6" required>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirmPassword" minlength="6" required>
      </div>
      <button class="btn" style="width:100%" type="submit">RESET PASSWORD</button>
    </form>
  </div>

  <script>
    const token = new URLSearchParams(location.search).get('token');
    const msg = document.getElementById('message');
    const form = document.getElementById('resetForm');

    if (!token) {
      msg.style.color = 'red';
      msg.innerHTML = 'Invalid link. No token found in URL.';
      form.style.display = 'none';
    } else {
      msg.innerHTML = 'Write new Password..';
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const password = fd.get('password');
      const confirmPassword = fd.get('confirmPassword');

      if (password !== confirmPassword) {
        msg.style.color = 'red';
        msg.innerHTML = 'Passwords do not match!';
        return;
      }

      msg.style.color = 'blue';
      msg.innerHTML = 'Sending data to server...';

      try {
        // 1. Try the standard URL
        let response = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });

        // 2. If that fails (404), try the API URL automatically
        if (response.status === 404) {
          msg.innerHTML = 'First URL failed. Trying backup URL...';
          response = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password })
          });
        }

        const data = await response.json();
        
        if (response.ok) {
          msg.style.color = 'green';
          msg.innerHTML = 'SUCCESS! Password changed.';
          setTimeout(() => location.href = '/login', 2000);
        } else {
          msg.style.color = 'red';
          msg.innerHTML = 'Server Error: ' + (data.error || 'Unknown error');
        }
      } catch (error) {
        msg.style.color = 'red';
        msg.innerHTML = 'Network Error: ' + error.message;
      }
    };
  </script>
</body>
</html>
