<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="nav" class="nav"></div>

  <div class="form-box">
    <h2>Forgot Password</h2>
    <p class="small-muted" style="text-align:center;margin-bottom:1rem">Enter your email and we will send a reset link.</p>
    <form id="forgotForm">
      <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
      <button class="btn" style="width:100%">SEND RESET LINK</button>
      <p style="text-align:center;margin-top:1rem"><a href="/login">Back to login</a></p>
    </form>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('forgotForm').onsubmit = async (e) => {
      e.preventDefault();
      try {
        const fd = new FormData(e.target);
        const data = await api('/api/auth/forgot-password', {
          method: 'POST', body: JSON.stringify({ email: fd.get('email') })
        });
        toast(data.message || 'Reset link sent');
      } catch (err) { toast(err.message); }
    };
  </script>
</body>
</html>
